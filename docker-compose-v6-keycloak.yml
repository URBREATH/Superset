version: "3.9"

# Staging Superset with Keycloak OAuth enabled.
# This stack runs only an additional Superset instance and reuses db_v6/redis_v6
# already running in docker-compose-v6.yml on the external network superset_net_v6.

networks:
  superset_net_v6:
    external: true

services:
  superset_keycloak_v6:
    build: .
    container_name: superset_keycloak_v6
    ports:
      - "17790:8088"
    env_file:
      - .env.v6.keycloak
    environment:
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@db_v6:5432/superset
      - DATABASE_HOST=db_v6
      - DATABASE_PORT=5432
      - DATABASE_DB=superset
      - DATABASE_USER=superset
      - DATABASE_PASSWORD=superset
      - PYTHONPATH=/app/pythonpath
    volumes:
      - superset_home_v6_keycloak:/app/superset_home
      - ./assets/superset-logo-horiz.png:/app/superset/static/assets/images/superset-logo-horiz.png
      - ./superset_config.py:/app/pythonpath/superset_config.py
    networks:
      - superset_net_v6
    entrypoint:
      - bash
      - -c
      - |
        echo 'Waiting for DB...' &&
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Admin --lastname User --email admin@superset.local --password admin 2>/dev/null || true &&
        superset init &&
        echo 'Superset Keycloak staging ready!' &&
        gunicorn --bind 0.0.0.0:8088 --workers 4 --timeout 120 --limit-request-line 0 'superset.app:create_app()'
    restart: unless-stopped

volumes:
  superset_home_v6_keycloak:

