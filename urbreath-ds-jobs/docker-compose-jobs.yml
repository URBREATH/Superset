# docker-compose-jobs.yml ? Deployment urbreath-ds-jobs (Spring Boot Batch)
# Configurazione scheduler in application.yaml; gestione runtime da backoffice.

services:
  urbreath-ds-jobs:
    build: .
    # Se si usa un'immagine pre-buildata:
    # image: urbreath-ds-jobs:1.0.0
    container_name: urbreath-ds-jobs
    restart: unless-stopped

    environment:
      # ?? Jasypt: OBBLIGATORIA per decriptare le credenziali ENC(...) ???????
      - JASYPT_PASSWORD=${JASYPT_PASSWORD}
      - BACKOFFICE_TOKEN=${BACKOFFICE_TOKEN}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${APP_DB_HOST}:${APP_DB_PORT}/${APP_DB_NAME}?reWriteBatchedInserts=true
      - SPRING_DATASOURCE_USERNAME=${APP_DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${APP_DB_PASSWORD}

      # Schedulazioni gestite da application.yaml + backoffice runtime.
      # Nessun override cron/enabled da env per evitare configurazioni duplicate.

      # ?? Override endpoint servizi esterni (opzionale) ?????????????????????
      # - FROST_BASE_URL=https://frost.urbreath.tech/FROST-Server/v1.1
      # - MINIO_ENDPOINT=https://minio-api.urbreath.tech/

    volumes:
      # Override configurazione per produzione (opzionale ma raccomandato):
      # - ./config/application-prod.yaml:/app/config/application.yaml:ro
      - jobs_logs:/app/logs

    ports:
      - "${BACKOFFICE_PORT:-18180}:8080"
    # Per debug remoto JDWP aggiungere anche:
    # - "5005:5005"

    networks:
      - superset_net_v6

volumes:
  jobs_logs:

networks:
  superset_net_v6:
    external: true
