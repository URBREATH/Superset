{% if entry == 'embedded' %}
<style>
  #urbreath-google-translate-element,
  iframe.goog-te-banner-frame,
  iframe[style*="position: fixed"],
  iframe[style*="position:fixed"],
  .goog-te-banner-frame,
  #goog-gt-tt {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
  }

  body {
    top: 0 !important;
  }
</style>
<script
  nonce="{{ macros.get_nonce() }}"
  src="{{ assets_prefix }}/static/assets/embedded-google-translator.js"
  defer
></script>
{% endif %}
