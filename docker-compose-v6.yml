# docker-compose-v6.yml - Stack Superset 6.1.0 per test WSL
# Porta Superset: 17789  |  Porta urbreath_dev: 5434  |  Frontend: 3001

networks:
  superset_net_v6:
    external: true

services:

  # ?? PostgreSQL per metadati Superset (DB fresco) ??????????????????
  db_v6:
    image: postgres:16
    container_name: superset-db-v6
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset
    volumes:
      - db_data_v6:/var/lib/postgresql/data
    networks:
      - superset_net_v6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 10

  superset_v6:
    build: .
    container_name: superset_v6
    ports:
      - "17789:8088"
    environment:
      - SUPERSET_ENV=production
      - SUPERSET_LOAD_EXAMPLES=no
      - SUPERSET_ADMIN_USERNAME=admin
      - SUPERSET_ADMIN_EMAIL=admin@superset.local
      - SUPERSET_ADMIN_PASSWORD=admin
      - SUPERSET_ADMIN_FIRSTNAME=Admin
      - SUPERSET_ADMIN_LASTNAME=User
      - SUPERSET_SECRET_KEY=CHANGE_ME_SUPERSET_SECRET_KEY_LONG_RANDOM
      - ENABLE_KEYCLOAK_OAUTH=true
      - KEYCLOAK_BASE_URL=https://keycloak-dev.urbreath.tech/auth
      - KEYCLOAK_REALM=urbreath-auth
      - KEYCLOAK_CLIENT_ID=urbreath
      - KEYCLOAK_CLIENT_SECRET=w0Ebfzs3lqjorCWXypaj0wzyLL8TUqLi
      - AUTH_USER_REGISTRATION_ROLE=Gamma
      - AUTH_ROLES_SYNC_AT_LOGIN=true
      - ENABLE_PROXY_FIX=true
      - WTF_CSRF_ENABLED=false
      - TALISMAN_ENABLED=false
      - X_FRAME_OPTIONS=ALLOWALL
      - CORS_ALLOWED_ORIGINS=http://localhost:17789,http://localhost:3000,http://localhost:3001,https://superset-dev.urbreath.tech
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://superset:superset@db_v6:5432/superset
      - MAPBOX_API_KEY=pk.eyJ1IjoiZXNwbzMiLCJhIjoiY21iN3V6eXdwMDAyNDJscXQ5cnR2MjZ0ayJ9.kMZ3pI6upOC4NEuC5H-e0g
      - PYTHONPATH=/app/pythonpath
    volumes:
      - superset_home_v6:/app/superset_home
    networks:
      - superset_net_v6
    depends_on:
      db_v6:
        condition: service_healthy
      redis_v6:
        condition: service_started
    entrypoint:
      - bash
      - -c
      - |
        echo 'Waiting for DB...' &&
        superset db upgrade &&
        superset fab create-admin --username "${SUPERSET_ADMIN_USERNAME}" --firstname "${SUPERSET_ADMIN_FIRSTNAME}" --lastname "${SUPERSET_ADMIN_LASTNAME}" --email "${SUPERSET_ADMIN_EMAIL}" --password "${SUPERSET_ADMIN_PASSWORD}" 2>/dev/null || true &&
        superset init &&
        echo 'Superset Keycloak staging ready!' &&
        gunicorn --bind 0.0.0.0:8088 --workers 1 --timeout 120 --limit-request-line 0 'superset.app:create_app()'
    restart: unless-stopped

  # ?? Redis ?????????????????????????????????????????????????????????
  redis_v6:
    image: redis:7-alpine
    container_name: redis_v6
    networks:
      - superset_net_v6

  # ?? PostgreSQL per dati urbreath_dev (clone dal dump prod) ????????
  otherdb_v6:
    image: postgres:16
    container_name: external-postgres-v6
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: urbreath_dev
      POSTGRES_USER: external_user
      POSTGRES_PASSWORD: external_pass
    volumes:
      - other_db_data_v6:/var/lib/postgresql/data
    networks:
      - superset_net_v6
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U external_user -d urbreath_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ?? pgAdmin (opzionale, per ispezione DB) ?????????????????????????
  admindb_v6:
    image: dpage/pgadmin4
    container_name: pgadmin_v6
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@urbreath.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "17710:80"
    networks:
      - superset_net_v6

  # ?? Frontend React Embedded ???????????????????????????????????????
  embeddedsuperset_v6:
    build: ./urbreath-ds-embedded
    container_name: embeddedsuperset_v6
    env_file:
      - .env.v6
    ports:
      - "3001:80"
    depends_on:
      - superset_v6
    networks:
      - superset_net_v6

volumes:
  db_data_v6:
  superset_home_v6:
  other_db_data_v6:
